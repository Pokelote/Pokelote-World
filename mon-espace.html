<script>
  function showBootError(msg) {
    var box = document.getElementById("boot-error");
    box.style.display = "block";
    box.textContent = "Une erreur a empêché le chargement de l'application :\n\n" + msg + "\n\nCopiez ce message et envoyez-le à Claude pour le corriger.";
  }
  window.addEventListener("error", function (e) {
    showBootError((e.message || "Erreur inconnue") + "\n(ligne " + e.lineno + ", colonne " + e.colno + ")");
  });
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        // Les navigateurs ne revérifient le sw.js qu'une fois par 24h par défaut sur simple navigation ;
        // on force une vérification à chaque ouverture pour récupérer les mises à jour sans attendre.
        reg.update().catch(function () {});
        if (document.visibilityState === "visible") reg.update().catch(function () {});
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") reg.update().catch(function () {});
        });
      }).catch(function () {});
    });
  }
</script>

<script type="text/babel" data-presets="react">
try {

const { useState, useEffect, useCallback } = React;

// --- Stockage local (remplace window.storage de Claude par le localStorage du navigateur) ---
// Stockage synchronisé entre appareils via Supabase (projet "mon-espace"), avec localStorage
// comme cache/repli hors-ligne. Un seul fetch groupé au démarrage (pas un par clé) ; chaque
// set() écrit en local immédiatement puis pousse vers Supabase en arrière-plan (fire-and-forget,
// jamais bloquant si le réseau est coupé).
const SUPABASE_URL = "https://tgaivklxkpiqrqwvlzso.supabase.co";
const SUPABASE_KEY = "sb_publishable_Y4DMRmC5QKXAho9fZ_FyKw_8JR4lFg_";

// Chaque clé a un horodatage local ("portail:__ts__:<clé>") en plus de sa valeur, pour pouvoir
// arbitrer les conflits par "le plus récent gagne" plutôt que par "quelle requête réseau finit
// en premier" — sans ça, décocher puis recharger très vite pouvait faire réapparaître l'ancienne
// valeur si le fetch de lecture du rechargement arrivait avant que l'écriture précédente n'ait
// fini d'atteindre Supabase.
function _localTs(key) {
  return parseInt(localStorage.getItem("portail:__ts__:" + key) || "0", 10);
}
function _setLocalTs(key, ts) {
  try {
    localStorage.setItem("portail:__ts__:" + key, String(ts));
  } catch {}
}

function _pushToRemote(key, value, ts) {
  fetch(`${SUPABASE_URL}/rest/v1/app_state?on_conflict=key`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      Prefer: "resolution=merge-duplicates,return=minimal",
    },
    body: JSON.stringify({ key, value, updated_at: new Date(ts).toISOString() }),
  }).catch(() => {});
}

let _remoteCache = null;
// Extrait en fonction réutilisable (pas juste une promesse figée au démarrage) pour pouvoir
// forcer une resynchronisation plus tard — notamment quand l'app redevient visible, voir
// window.storage.refresh() et le hook useVisibilityRefresh plus bas.
async function _syncFromRemote() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_state?select=key,value,updated_at`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
    });
    if (!res.ok) throw new Error("Supabase indisponible");
    const rows = await res.json();
    const next = new Map();
    rows.forEach((r) => {
      const remoteTs = new Date(r.updated_at).getTime();
      const localTs = _localTs(r.key);
      if (localTs > remoteTs) {
        // Une écriture locale plus récente n'avait pas encore atteint Supabase au moment de
        // cette lecture : on garde la valeur locale et on repousse pour rattraper le cloud.
        const localValue = localStorage.getItem("portail:" + r.key);
        if (localValue !== null) {
          next.set(r.key, localValue);
          _pushToRemote(r.key, localValue, localTs);
          return;
        }
      }
      next.set(r.key, r.value);
      try {
        localStorage.setItem("portail:" + r.key, r.value);
      } catch {}
      _setLocalTs(r.key, remoteTs);
    });
    _remoteCache = next;
    // Rattrapage : un appareil qui avait déjà des données locales (cases cochées etc.) AVANT
    // l'arrivée de la synchro n'a jamais rien poussé vers Supabase. Au premier chargement de
    // cette version sur cet appareil, on pousse une fois toute donnée locale absente du cloud,
    // pour que ces anciennes coches deviennent enfin visibles sur les autres appareils.
    try {
      Object.keys(localStorage)
        .filter((k) => k.startsWith("portail:") && !k.startsWith("portail:__ts__:"))
        .forEach((k) => {
          const key = k.slice("portail:".length);
          if (!_remoteCache.has(key)) {
            const value = localStorage.getItem(k);
            const ts = Date.now();
            _remoteCache.set(key, value);
            _setLocalTs(key, ts);
            _pushToRemote(key, value, ts);
          }
        });
    } catch {}
  } catch {
    _remoteCache = null;
  }
}

const _remoteReady = _syncFromRemote();

window.storage = {
  async get(key) {
    await _remoteReady;
    if (_remoteCache && _remoteCache.has(key)) {
      return { key, value: _remoteCache.get(key), shared: true };
    }
    const raw = localStorage.getItem("portail:" + key);
    if (raw === null) return null;
    return { key, value: raw, shared: false };
  },
  async set(key, value) {
    const ts = Date.now();
    localStorage.setItem("portail:" + key, value);
    _setLocalTs(key, ts);
    if (_remoteCache) _remoteCache.set(key, value);
    _pushToRemote(key, value, ts);
    return { key, value, shared: false };
  },
  async delete(key) {
    localStorage.removeItem("portail:" + key);
    localStorage.removeItem("portail:__ts__:" + key);
    if (_remoteCache) _remoteCache.delete(key);
    fetch(`${SUPABASE_URL}/rest/v1/app_state?key=eq.${encodeURIComponent(key)}`, {
      method: "DELETE",
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
    }).catch(() => {});
    return { key, deleted: true, shared: false };
  },
  async list(prefix) {
    await _remoteReady;
    const keys = new Set();
    if (_remoteCache) {
      _remoteCache.forEach((_, k) => {
        if (k.startsWith(prefix || "")) keys.add(k);
      });
    }
    const p = "portail:" + (prefix || "");
    Object.keys(localStorage)
      .filter((k) => k.startsWith(p) && !k.startsWith("portail:__ts__:"))
      .forEach((k) => keys.add(k.slice("portail:".length)));
    return { keys: Array.from(keys) };
  },
};

function darken(hex, amount) {
  const num = parseInt(hex.slice(1), 16);
  let r = (num >> 16) - amount;
  let g = ((num >> 8) & 0x00ff) - amount;
  let b = (num & 0x0000ff) - amount;
  r = Math.max(0, r);
  g = Math.max(0, g);
  b = Math.max(0, b);
  return "#" + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
}

async function loadThemeStorage(themes, storagePrefix, defaultItems, defaultCollections) {
  const lists = {};
  const cols = {};
  for (const t of themes) {
    try {
      const res = await window.storage.get(`${storagePrefix}-${t.key}`);
      lists[t.key] = res ? JSON.parse(res.value) : defaultItems[t.key] || [];
    } catch {
      lists[t.key] = defaultItems[t.key] || [];
    }
    try {
      const res = await window.storage.get(`${storagePrefix}-${t.key}-collections`);
      cols[t.key] = res ? JSON.parse(res.value) : defaultCollections[t.key] || [];
    } catch {
      cols[t.key] = defaultCollections[t.key] || [];
    }
  }
  return { lists, cols };
}

function App() {
  const [activeSpace, setActiveSpace] = useState("clement");
  const [active, setActive] = useState("accueil");
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const [themeLists, setThemeLists] = useState(null);
  const [collections, setCollections] = useState(null);
  const [lectureThemeLists, setLectureThemeLists] = useState(null);
  const [lectureCollections, setLectureCollections] = useState(null);
  const [mcuChecked, setMcuChecked] = useState(null);
  const [taskChecks, setTaskChecks] = useState(null);
  const [taskArchive, setTaskArchive] = useState(null);
  const [offerStatus, setOfferStatusState] = useState(null);
  const [terrainArchive, setTerrainArchiveState] = useState(null);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    let cancelled = false;
    async function load() {
      const { lists, cols } = await loadThemeStorage(THEMES, "theme", DEFAULT_THEME_ITEMS, DEFAULT_COLLECTIONS);
      const { lists: lectureLists, cols: lectureCols } = await loadThemeStorage(
        LECTURE_THEMES,
        "lecture-theme",
        LECTURE_DEFAULT_ITEMS,
        LECTURE_DEFAULT_COLLECTIONS
      );
      let mcu = MCU_DEFAULT_CHECKED;
      try {
        const res = await window.storage.get("mcu-checked");
        mcu = res ? JSON.parse(res.value) : MCU_DEFAULT_CHECKED;
      } catch {
        mcu = MCU_DEFAULT_CHECKED;
      }
      let tasks = {};
      try {
        const res = await window.storage.get("task-checks");
        tasks = res ? JSON.parse(res.value) : {};
      } catch {
        tasks = {};
      }
      let archive = {};
      try {
        const res = await window.storage.get("task-archive");
        archive = res ? JSON.parse(res.value) : {};
      } catch {
        archive = {};
      }
      let offerStatusValue = {};
      try {
        const res = await window.storage.get("job-offer-status");
        offerStatusValue = res ? JSON.parse(res.value) : {};
      } catch {
        offerStatusValue = {};
      }
      let terrainArchiveValue = {};
      try {
        const res = await window.storage.get("terrain-archive");
        terrainArchiveValue = res ? JSON.parse(res.value) : {};
      } catch {
        terrainArchiveValue = {};
      }
      let archiveChanged = false;
      // Migration : les anciens schémas d'id ("date__catégorie" ou "date__catégorie__heure")
      // laissaient une entrée orpheline dès qu'un événement changeait de catégorie détectée
      // (ex: "Travail sur Roadmap" reclassé de Blog vers général). L'id est maintenant
      // uniquement "date__heure" (identifie l'événement, pas sa catégorie), donc on purge
      // d'abord les entrées à l'ancien format.
      Object.keys(archive).forEach((key) => {
        const parts = key.split("__");
        if (parts.length >= 2 && TASK_CATEGORIES[parts[1]]) {
          delete archive[key];
          archiveChanged = true;
        }
      });
      CALENDAR_DATA.events.forEach((ev) => {
        const parsed = parseTaskEvent(ev);
        if (!parsed) return;
        const id = `${ev.date}__${ev.time}`;
        const entry = { date: ev.date, time: ev.time, key: parsed.key, label: parsed.label, tasks: parsed.tasks };
        const existing = archive[id];
        if (!existing || JSON.stringify(existing) !== JSON.stringify(entry)) {
          archive = { ...archive, [id]: entry };
          archiveChanged = true;
        }
      });
      if (archiveChanged) {
        try {
          await window.storage.set("task-archive", JSON.stringify(archive));
        } catch (e) {
          console.error("Erreur de sauvegarde", e);
        }
      }
      if (!cancelled) {
        setThemeLists(lists);
        setCollections(cols);
        setLectureThemeLists(lectureLists);
        setLectureCollections(lectureCols);
        setMcuChecked(mcu);
        setTaskChecks(tasks);
        setTaskArchive(archive);
        setOfferStatusState(offerStatusValue);
        setTerrainArchiveState(terrainArchiveValue);
        setReady(true);
      }
    }
    load();
    return () => {
      cancelled = true;
    };
  }, []);

function CollectionTab({ themes, defaultTheme, themeLists, updateThemeList, collections, updateCollections, mcu, alwaysShowDivider }) {
  const [theme, setTheme] = useState(defaultTheme);
  const cfg = themes.find((t) => t.key === theme);
  const themeCollections = (collections && collections[theme]) || [];

  function removeCollection(id) {
    updateCollections(theme, (prev) => prev.filter((c) => c.id !== id));
  }

  function updateCollectionItems(id, updater) {
    updateCollections(theme, (prev) => prev.map((c) => (c.id === id ? { ...c, items: updater(c.items) } : c)));
  }

  return (
    <div>
      <PillTabs options={themes} activeKey={theme} onSelect={setTheme} accentOf={(t) => t.accent} />

      {mcu && theme === mcu.themeKey && (
        <CollapsibleSection title="MCU" accent={cfg.accent} badge={`${mcu.checked.length} / ${MCU_TOTAL}`}>
          <McuList checked={mcu.checked} onToggle={mcu.toggle} />
        </CollapsibleSection>
      )}

      {themeCollections.map((c) => {
        const trackableItems = c.items.filter((it) => !it.upcoming);
        const watchedCount = trackableItems.filter((it) => it.status === "vu").length;
        return (
          <CollapsibleSection
            key={c.id}
            title={c.name}
            accent={cfg.accent}
            badge={trackableItems.length > 0 ? `${watchedCount} / ${trackableItems.length}` : null}
            onRemove={() => removeCollection(c.id)}
          >
            <CollectionItems accent={cfg.accent} items={c.items} onChange={(fn) => updateCollectionItems(c.id, fn)} />
          </CollapsibleSection>
        );
      })}

      {(alwaysShowDivider || themeCollections.length > 0) && (
        <div style={{ height: 1, background: COLORS.border, margin: "20px 0 28px" }} />
      )}

      <ThemeList theme={cfg} items={(themeLists && themeLists[theme]) || []} onChange={(fn) => updateThemeList(theme, fn)} />
    </div>
  );
}

function PillTabs({ options, activeKey, onSelect, accentOf, marginBottom = 28, transition = false }) {
  return (
    <div style={{ display: "flex", gap: 8, marginBottom, flexWrap: "wrap" }}>
      {options.map((o) => {
        const accent = accentOf(o);
        const isActive = o.key === activeKey;
        return (
          <button
            key={o.key}
            onClick={() => onSelect(o.key)}
            style={{
              padding: "7px 16px",
              borderRadius: 999,
              border: `1px solid ${isActive ? darken(accent, 30) : COLORS.border}`,
              background: isActive ? accent : "transparent",
              color: isActive ? "white" : COLORS.muted,
              fontFamily: FONT_BODY,
              fontSize: 13,
              cursor: "pointer",
              ...(transition ? { transition: "background 0.15s, color 0.15s" } : null),
            }}

}

function CollapsibleSection({ title, accent, badge, children, onRemove, defaultOpen = false }) {

function CollectionItems({ accent, items, onChange }) {
  function patchItem(id, patch) {
    onChange((prev) => prev.map((it) => (it.id === id ? { ...it, ...patch } : it)));
  }

  if (items.length === 0) {
    return <p style={{ color: COLORS.muted, fontSize: 13, fontStyle: "italic" }}>Rien ici pour l'instant.</p>;
  }

  const hasPhases = items.some((it) => it.phase);

  if (!hasPhases) {
    return (
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(min(300px, 100%), 1fr))", gap: 10, alignItems: "start" }}>
        {items.map((it) => (
          <ItemRow key={it.id} item={it} accent={accent} onPatch={(patch) => patchItem(it.id, patch)} />
        ))}
      </div>
    );
  }

  const phaseOrder = [];
  const byPhase = {};
  items.forEach((it) => {
    const key = it.phase || "";
    if (!byPhase[key]) {
      byPhase[key] = { name: it.phase || "Autres", color: it.phaseColor || accent, items: [] };
      phaseOrder.push(key);
    }
    byPhase[key].items.push(it);
  });

  const trackable = items.filter((it) => !it.upcoming);
  const watchedTotal = trackable.filter((it) => it.status === "vu").length;
  const pct = trackable.length ? Math.round((watchedTotal / trackable.length) * 100) : 0;

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 24 }}>
        <div style={{ flex: 1, height: 6, borderRadius: 3, background: COLORS.track, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${pct}%`, background: COLORS.checked, transition: "width 0.3s ease" }} />
        </div>
        <div style={{ fontSize: 13, color: COLORS.muted, whiteSpace: "nowrap" }}>{watchedTotal} / {trackable.length}</div>
      </div>

      {phaseOrder.map((key, idx) => {
        const group = byPhase[key];
        const groupTrackable = group.items.filter((it) => !it.upcoming);
        const groupWatched = groupTrackable.filter((it) => it.status === "vu").length;
        return (
          <div
            key={key || "sans-phase"}
            style={{ borderLeft: `3px solid ${group.color}`, paddingLeft: 20, marginBottom: idx === phaseOrder.length - 1 ? 0 : 24 }}
          >
            <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 10 }}>
              <span style={{ fontFamily: FONT_DISPLAY, fontSize: 16, color: group.color }}>{group.name}</span>
              {groupTrackable.length > 0 && (
                <span style={{ fontSize: 12, color: COLORS.muted }}>{groupWatched} / {groupTrackable.length}</span>
              )}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(min(300px, 100%), 1fr))", gap: 10, alignItems: "start" }}>
              {group.items.map((it) => (
                <ItemRow key={it.id} item={it} accent={group.color} onPatch={(patch) => patchItem(it.id, patch)} />
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function McuList({ checked, onToggle }) {
  const count = checked.length;
  const pct = Math.round((count / MCU_TOTAL) * 100);

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 24 }}>
        <div style={{ flex: 1, height: 6, borderRadius: 3, background: COLORS.track, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${pct}%`, background: COLORS.checked, transition: "width 0.3s ease" }} />
        </div>
        <div style={{ fontSize: 13, color: COLORS.muted, whiteSpace: "nowrap" }}>{count} / {MCU_TOTAL}</div>
      </div>

      {MCU_PHASES.map((p) => (
        <div key={p.phase} style={{ borderLeft: `3px solid ${p.color}`, paddingLeft: 20, marginBottom: 28 }}>
          <div style={{ fontFamily: FONT_DISPLAY, fontSize: 17, color: p.color, marginBottom: 2 }}>{p.phase}</div>
          <div style={{ fontSize: 12, color: COLORS.muted, marginBottom: 12 }}>{p.stone}</div>
          <div style={{ display: "flex", flexDirection: "column" }}>
            {p.items.map((it) => {
              const isChecked = checked.includes(it.id);
              return (
                <div
                  key={it.id}
                  onClick={() => onToggle(it.id)}
                  style={{ display: "flex", alignItems: "center", gap: 12, padding: "9px 0", borderBottom: `1px solid ${COLORS.border}`, cursor: "pointer" }}
                >
                  <span
                    style={{
                      width: 18, height: 18, borderRadius: 4,
                      border: `1.5px solid ${isChecked ? COLORS.checked : COLORS.border}`,
                      background: isChecked ? COLORS.checked : "transparent",
                      display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
                    }}
                  >
                    {isChecked && <Check size={12} color="white" />}
                  </span>
                  <span style={{ fontSize: 14, color: isChecked ? COLORS.muted : COLORS.text, textDecoration: isChecked ? "line-through" : "none" }}>
                    {it.title}
                  </span>
                  <span style={{ fontSize: 12, color: COLORS.muted, marginLeft: "auto" }}>{it.year}</span>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

function OfferStatusPicker({ status, onSelect }) {
  return (
    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 10 }}>
      {OFFER_STATUSES.map((s) => {
        const isActive = status === s.key;
        const activeColor =
          s.key === "postule" ? COLORS.checked : s.key === "pas-interesse" ? COLORS.barMuted : s.key === "indisponible" ? "#B85C5C" : RECHERCHE_EMPLOI_ACCENT;
        return (
          <button
            key={s.key}
            onClick={() => onSelect(isActive ? null : s.key)}
            style={{
              fontSize: 11,
              padding: "3px 10px",
              borderRadius: 999,
              border: `1px solid ${isActive ? darken(activeColor, 20) : COLORS.border}`,
              background: isActive ? activeColor : "transparent",
              color: isActive ? "white" : COLORS.muted,
              cursor: "pointer",
              fontFamily: FONT_BODY,
            }}
          >
            {s.label}
          </button>
        );
      })}
    </div>
  );
}

function JobOffersList({ data, title, accent, statusMap, onSetStatus }) {
  return (
    <div>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 20, flexWrap: "wrap", gap: 8 }}>
        <div>
          <h1 style={{ fontFamily: FONT_DISPLAY, fontSize: 32, color: COLORS.text, margin: 0, fontWeight: 600 }}>{title}</h1>
          <span style={{ fontSize: 13, color: COLORS.muted }}>{data.domain}</span>
          {data.note && <p style={{ fontSize: 12, color: COLORS.muted, fontStyle: "italic", margin: "6px 0 0", lineHeight: 1.5, maxWidth: 620 }}>{data.note}</p>}
        </div>
        <span style={{ fontSize: 12, color: COLORS.muted }}>Mis à jour le {data.updatedAt}</span>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {data.items.map((it) => {
          const status = statusMap[it.id] || null;
          return (
            <div
              key={it.id}
              style={{
                background: COLORS.card,
                borderRadius: 10,
                padding: "14px 16px",
                borderLeft: `3px solid ${status === "postule" ? COLORS.checked : status === "indisponible" ? "#B85C5C" : accent}`,
                opacity: status === "pas-interesse" || status === "indisponible" ? 0.55 : 1,
              }}
            >
              <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 8, marginBottom: 2 }}>
                <span style={{ fontSize: 14, fontWeight: 500, color: COLORS.text, textDecoration: status === "indisponible" ? "line-through" : "none" }}>{it.title}</span>
                <span style={{ fontSize: 10, color: COLORS.muted, border: `1px solid ${COLORS.border}`, borderRadius: 999, padding: "1px 8px", flexShrink: 0 }}>
                  {it.contract}
                </span>
              </div>
              <div style={{ fontSize: 12, color: COLORS.muted, marginBottom: 8 }}>{it.company} · {it.location}</div>
              <p style={{ fontSize: 13, color: COLORS.text, lineHeight: 1.5, margin: "0 0 6px" }}>{it.summary}</p>
              <a href={it.url} target="_blank" rel="noreferrer" style={{ fontSize: 11, color: COLORS.muted }}>{it.source}</a>
              <OfferStatusPicker status={status} onSelect={(s) => onSetStatus(it.id, s)} />
            </div>
          );
        })}
      </div>
    </div>
  );
}

function makeOfferStatusSetter(setOfferStatus) {
  return function setStatusFor(id, status) {
    setOfferStatus((prev) => {
      const next = { ...prev };
      if (status) next[id] = status;
      else delete next[id];
      return next;
    });
  };
}

function RechercheEmploiTab({ offerStatus, setOfferStatus }) {
  const [section, setSection] = useState("interim");
  const setStatusFor = makeOfferStatusSetter(setOfferStatus);

  return (
    <div>
      <PillTabs options={RECHERCHE_EMPLOI_SECTIONS} activeKey={section} onSelect={setSection} accentOf={() => RECHERCHE_EMPLOI_ACCENT} />
      {section === "interim" && (
        <JobOffersList data={INTERIM_OFFERS} title="Intérim" accent={RECHERCHE_EMPLOI_ACCENT} statusMap={offerStatus} onSetStatus={setStatusFor} />
      )}
      {section === "cdd-cdi" && (
        <JobOffersList data={JOB_OFFERS} title="CDD / CDI" accent={RECHERCHE_EMPLOI_ACCENT} statusMap={offerStatus} onSetStatus={setStatusFor} />
      )}
    </div>
  );
}

 du SOPK, et l'objectif n'est pas de maigrir à tout prix."]]}, {"t": "L'assiette", "items": [["Composition", "½ assiette de légumes · ¼ de protéines · ¼ de féculents ou légumineuses · 1 source de bon gras."], ["Ordre de repas", "Légumes d'abord, puis protéines et bon gras, féculents en dernier : le pic de glycémie est plus faible."], ["Petit-déjeuner", "Salé, protéiné et gras (œufs) : le corps est très sensible à l'insuline le matin. Idéalement 1-2 protéines, 1-2 bons gras, 2-3 sources de fibres (d'où les légumes dans les œufs)."]]}, {"t": "Glucides & IG", "items": [["À privilégier", "Quinoa, lentilles, pois chiches, haricots rouges, patate douce, riz basmati, sarrasin, pâtes complètes al dente."], ["À limiter", "Pommes de terre (IG élevé, sauf refroidies en salade), pain blanc, riz blanc rond, céréales soufflées, semoule, pâtisseries, sucres, jus de fruits, sodas."], ["Cuisson", "Al dente : plus un féculent est cuit, plus il fait monter la glycémie."], ["Fruits", "2-3 par jour, pas trop mûrs, jamais seuls : avec des amandes, un laitage, ou après un repas riche en fibres."]]}, {"t": "Protéines & graisses", "items": [["Protéines", "À chaque repas et collation. SOVA : au moins 1 g/kg/jour pour Estelle."], ["Oméga 3", "Petits poissons gras (sardines, maquereau, hareng, anchois) au moins 2×/semaine. Saumon et thon 1×/semaine maximum (métaux lourds). Huiles de colza, noix, lin crues pour l'assaisonnement ; olive pour cuire."], ["Viandes", "Viande blanche à privilégier ; viande rouge 1×/semaine pour le fer ; charcuterie à limiter."], ["Laitiers", "Pas plus de 2 par jour (SOVA), moins si inconfort digestif."]]}, {"t": "Au quotidien", "items": [["Thé vert / café", "Plutôt 1 h après le repas : ils gênent l'absorption du fer. Les infusions, elles, ne posent pas de problème."], ["Épices", "Curcuma, cannelle, gingembre, thym, romarin, origan : riches en antioxydants."], ["Microbiote", "Prébiotiques : poireau, topinambour, artichaut, oignon, betterave. Probiotiques : légumes lacto-fermentés (choucroute, kimchi), kéfir."], ["Bouger", "10 min de marche après le repas réduit le pic de glycémie ; la musculation améliore la sensibilité à l'insuline."]]}, {"t": "Meal prep", "items": [["Contenants", "Boîtes en verre plutôt qu'en plastique, surtout pour réchauffer au micro-ondes (perturbateurs endocriniens)."], ["Portions", "Une taille de boîte par personne évite de tout repeser ; doubler les légumes dans la préparation."]]}, {"t": "État d'esprit", "items": [["Règle 80/20", "80 % d'aliments favorables, 20 % de plaisir, sans culpabilité. On parle d'habitudes, pas de régime. Intégrer les changements un par un."], ["Vigilance", "Les troubles du comportement alimentaire sont plus fréquents avec un SOPK : si l'alimentation devient source d'angoisse ou de culpabilité, en parler à un professionnel."]]}, {"t": "Ce qu'on a changé dans le menu commun", "items": [["Pour vous deux", "Pommes de terre remplacées par quinoa, riz basmati ou patate douce · légumes ajoutés aux œufs chaque matin · protéines variées sur la semaine : 3 poissons (saumon 1×, petits poissons gras 2×) + 1 poisson blanc, volailles (poulet, dinde), lapin, crevettes, bœuf 1×, légumineuses 3-4 soirs · huile de colza · thé à distance des repas."], ["Pour Estelle", "3 œufs, ~45 g de féculents crus, légumineuses et poisson en portions réduites, 3 fruits par jour toujours accompagnés, pas de fruit en dessert."]]}, {"t": "À propos des sources", "items": [["Note", "SOVA est une marque de compléments associée à une naturopathe. Les principes glycémie, protéines, oméga 3, légumes et activité rejoignent les recommandations médicales. Les conseils sur le gluten, les laitiers ou les cures (glutamine, compléments) sont moins bien étayés : à discuter avec son médecin avant de les suivre."]]}], "recettes": [["Dos de cabillaud au fenouil (et à l'orange)", "Déjeuner / dîner", "Automne", "Oui", "1 CAS d'huile au lieu de 20 cl ; 180 g de cabillaud", "Menu d'automne", "Idéal"], ["Papillote de saumon, compotée d // --- "Ma semaine" : planning composé à la main à partir des recettes déjà détaillées sur le
// site (5 rubriques par repas), ajoutées comme dans un panier ; la liste de courses se
// recalcule automatiquement à partir de ce qui a été choisi, avec les portions Clément | Estelle.
// Deux sources de recettes alimentent les rubriques :
//  - les recettes "structurées" (ingrédients + quantités précises) : celles du menu deux semaines
//    (ALIM_DATA.days) + de nouveaux petits-déjeuners/collations ajoutés ci-dessous pour varier ;
//  - le catalogue "Recettes" existant (ALIM_DATA.recettes, issu des classeurs/ebooks déjà intégrés
//    au site) : pas de quantités précises, mais affichées pour élargir le choix, avec les notes
//    d'adaptation et le niveau (Idéal/OK/Plaisir…).
function buildMealCardLibrary() {
  const cards = [];
  const seen = new Set();
  for (const day of ALIM_DATA.days) {
    for (const m of day.meals) {
      if (!m.items || m.items.length === 0) continue;
      const title = m.note || m.name;
      const dedupeKey = m.name + "::" + title;
      if (seen.has(dedupeKey)) continue;
      seen.add(dedupeKey);
      cards.push({
        id: dedupeKey.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""),
        slots: [m.name],
        title,
        items: m.items,
        kc: m.kc,
        ke: m.ke,
      });
    }
  }
  return cards;
}

// Rattache le "moment" du catalogue de recettes existant (ALIM_DATA.recettes) aux 5 rubriques.
function recetteToSlots(moment) {
  if (moment.startsWith("Petit-déjeuner")) return ["Petit-déjeuner"];
  if (moment.startsWith("Collation")) return ["Collation matin", "Collation après-midi"];
  if (moment.startsWith("Crudités")) return ["Collation après-midi"];
  if (moment.startsWith("Dessert")) return ["Dîner"];
  if (moment.startsWith("Accompagnement")) return ["Déjeuner", "Dîner"];
  if (moment.includes("Déjeuner") && moment.toLowerCase().includes("dîner")) return ["Déjeuner", "Dîner"];
  if (moment.startsWith("Déjeuner")) return ["Déjeuner"];
  if (moment.startsWith("Dîner")) return ["Dîner"];
  return ["Dîner"];
}

function parseQty(raw) {
  if (!raw || raw === "–") return null;
  const s = String(raw).trim();
  let m = s.match(/^([\d.,]+)\s*(kg|g)$/i);
  if (m) {
    let v = parseFloat(m[1].replace(",", "."));
    if (/kg/i.test(m[2])) v *= 1000;
    return { qty: v, unit: "g" };
  }
  m = s.match(/^([\d.,]+)\s*CAS$/i);
  if (m) return { qty: parseFloat(m[1].replace(",", ".")), unit: "CAS" };
  m = s.match(/^([\d.,]+)\s*portion/i);
  if (m) return { qty: parseFloat(m[1].replace(",", ".")), unit: "portion" };
  m = s.match(/^([\d.,]+)$/);
  if (m) return { qty: parseFloat(m[1].replace(",", ".")), unit: "unité" };
  return { qty: null, unit: null, raw: s };
}

function formatQty(unit, total) {
  if (unit === "g") return total >= 1000 ? (total / 1000).toFixed(1).replace(".", ",") + " kg" : Math.round(total) + " g";
  if (unit === "CAS") return (Number.isInteger(total) ? total : total.toFixed(1)) + " CAS";
  if (unit === "portion") return (Number.isInteger(total) ? total : total.toFixed(1)) + (total > 1 ? " portions" : " portion");
  return Number.isInteger(total) ? String(total) : total.toFixed(1);
}

function buildPanierCourses(panier, person) {
  const groups = {};
  const unquantified = [];
  Object.entries(panier || {}).forEach(([cardId, count]) => {
    if (!count) return;
    const card = ALL_CARDS_BY_ID[cardId];
    if (!card) return;
    if (!card.items) {
      if (person === 1) unquantified.push({ title: card.title, count });
      return;
    }
    card.items.forEach(([name, qc, qe]) => {
      const raw = person === 1 ? qc : qe;
      const parsed = parseQty(raw);
      if (!parsed) return;
      if (!groups[name]) groups[name] = { unit: parsed.unit, total: 0, rawParts: [] };
      const g = groups[name];
      if (parsed.qty != null && (g.unit === parsed.unit || g.total === 0)) {
        g.unit = parsed.unit;
        g.total += parsed.qty * count;
      } else if (parsed.qty != null) {
        for (let i = 0; i < count; i++) g.rawParts.push(raw);
      } else {
        for (let i = 0; i < count; i++) g.rawParts.push(parsed.raw);
      }
    });
  });
  const items = Object.entries(groups).map(([name, g]) => ({
    name,
    rayon: ALIM_RAYON_BY_NAME[name] || "Autres",
    display: [g.total > 0 ? formatQty(g.unit, g.total) : null, ...g.rawParts].filter(Boolean).join(" + "),
  }));
  return { items, unquantified };
}

  const { items: clem, unquantified } = buildPanierCourses(panier, 1);
  const { items: est } = buildPanierCourses(panier, 2);

    byRayon[it.rayon][it.name] = byRayon[it.rayon][it.name] || {};

function AlimPanierTab() {
  const [panier, setPanier] = useState(null);

  const [slot, setSlot] = useState(PLAN_MEAL_TYPES[0].slot);
  const [view, setView] = useState("recettes");

  useEffect(() => {
    let cancelled = false;
    (async () => {
      let p = {};
      try {
        const res = await window.storage.get("alim-panier-semaine");
        p = res ? JSON.parse(res.value) : {};
      } catch {
        p = {};
      }
      let c = {};
      try {
        const res = await window.storage.get("alim-panier-courses-checked");
        c = res ? JSON.parse(res.value) : {};
      } catch {
        c = {};
      }
      if (!cancelled) {
        setPanier(p);
        setChecked(c);
      }
    })();
    return () => {
      cancelled = true;
    };
  }, []);

  function setCount(cardId, count) {
    setPanier((prev) => {
      const next = { ...(prev || {}) };
      if (count <= 0) delete next[cardId];
      else next[cardId] = count;
      window.storage.set("alim-panier-semaine", JSON.stringify(next)).catch(() => {});
      return next;
    });
  }
  function toggleChecked(key) {
    setChecked((prev) => {
      const next = { ...prev };
      if (next[key]) delete next[key];
      else next[key] = true;
      window.storage.set("alim-panier-courses-checked", JSON.stringify(next)).catch(() => {});
      return next;
    });
  }

  if (!panier) return null;

  const slotCount = (s) => (CARDS_BY_SLOT[s] || []).reduce((sum, c) => sum + (panier[c.id] || 0), 0);
  const totalCount = Object.values(panier).reduce((s, n) => s + n, 0);

  return (
    <div>
      <PillTabs options={PANIER_VIEWS} activeKey={view} onSelect={setView} accentOf={() => ALIM_ACCENT} marginBottom={14} />
      {view === "recettes" && (
        <div>
          <p style={{ fontSize: 12, color: COLORS.muted, marginBottom: 12 }}>
            {totalCount} repas dans le panier de la semaine · vise environ 7 par rubrique, à ajuster selon vos besoins et vos sorties.
          </p>
          <PillTabs
            options={PLAN_MEAL_TYPES.map((m) => ({ key: m.slot, label: `${m.label} · ${slotCount(m.slot)}` }))}
            activeKey={slot}
            onSelect={setSlot}
            accentOf={() => ALIM_ACCENT}
            marginBottom={14}
          />
          <p style={{ fontSize: 11, color: COLORS.muted, marginBottom: 12 }}>
            {(CARDS_BY_SLOT[slot] || []).length} recettes disponibles dans cette rubrique.
          </p>
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {(CARDS_BY_SLOT[slot] || []).map((c) => {
              const count = panier[c.id] || 0;
              return (
                <div key={c.id} style={alimCard}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
                    <div style={{ fontSize: 14, color: count > 0 ? ALIM_ACCENT : COLORS.text, fontWeight: count > 0 ? 600 : 400 }}>{c.title}</div>
                    {c.kc > 0 && (
                      <span style={{ fontSize: 12, color: COLORS.muted, whiteSpace: "nowrap" }}>
                        ≈ <span style={{ color: COLORS.gold }}>{c.kc}</span> | <span style={{ color: "#7FBBAE" }}>{c.ke}</span> kcal
                      </span>
                    )}
                  </div>
                  {c.items ? (
                    <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, tableLayout: "fixed", marginBottom: 10 }}>
                      <colgroup><col style={{ width: "56%" }} /><col style={{ width: "22%" }} /><col style={{ width: "22%" }} /></colgroup>
                      <tbody>
                        {c.items.map(([al, qc, qe], i) => (
                          <tr key={i} style={{ borderTop: `1px solid ${COLORS.track}` }}>
                            <td style={{ padding: "5px 0", color: COLORS.text }}>{al}</td>
                            <td style={{ padding: "5px 0", textAlign: "right", color: COLORS.gold, whiteSpace: "nowrap" }}>{qc}</td>
                            <td style={{ padding: "5px 0 5px 12px", textAlign: "right", color: qe === "–" ? COLORS.muted : "#7FBBAE", whiteSpace: "nowrap" }}>{qe}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  ) : (
                    <div style={{ marginBottom: 10 }}>
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: c.note ? 6 : 0 }}>

                      </div>

                      {c.groupItems ? (

                    <button

                    {count > 0 && <span style={{ fontSize: 12, color: COLORS.muted }}>dans le panier</span>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
      {view === "courses" && <AlimPanierCourses panier={panier} checked={checked} onToggle={toggleChecked} />}
    </div>
  );
}

function AlimCourses() {
  const [week, setWeek] = useState(1);
  const [checked, setChecked] = useState({});
  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get("alimentation-courses-checked");
        if (res && res.value) setChecked(JSON.parse(res.value));
      } catch {}
    })();
  }, []);
  function save(next) {
    setChecked(next);
    window.storage.set("alimentation-courses-checked", JSON.stringify(next)).catch(() => {});
  }
  const wk = "w" + week;
  const items = ALIM_DATA.courses.filter((c) => c[wk]);
  const rayons = [...new Set(items.map((c) => c.rayon))];
  const done = items.filter((c) => checked[wk + ":" + c.id]).length;
  function toggle(id) {
    const k = wk + ":" + id;
    const next = { ...checked };
    if (next[k]) delete next[k];
    else next[k] = true;
    save(next);
  }
  function reset() {
    const next = { ...checked };
    Object.keys(next).forEach((k) => k.startsWith(wk + ":") && delete next[k]);
    save(next);
  }
  return (
    <div>
      <PillTabs options={ALIM_WEEKS} activeKey={week} onSelect={setWeek} accentOf={() => ALIM_ACCENT} marginBottom={12} />
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, gap: 12, flexWrap: "wrap" }}>
        <span style={{ fontSize: 13, color: COLORS.muted }}>Quantités pour vous deux · {done}/{items.length} cochés</span>
        <button onClick={reset} style={{ background: "transparent", border: `1px solid ${COLORS.border}`, color: COLORS.muted, borderRadius: 999, padding: "5px 12px", fontSize: 12, cursor: "pointer" }}>
          Tout décocher
        </button>
      </div>
      {rayons.map((r) => (
        <div key={r} style={{ ...alimCard, marginBottom: 12 }}>
          <h3 style={{ margin: "0 0 8px", fontFamily: FONT_DISPLAY, fontSize: 17, color: ALIM_ACCENT, fontWeight: 600 }}>{r}</h3>
          {items.filter((c) => c.rayon === r).map((c) => {
            const on = !!checked[wk + ":" + c.id];
            return (
              <label key={c.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "6px 0", borderTop: `1px solid ${COLORS.track}`, cursor: "pointer" }}>
                <input type="checkbox" checked={on} onChange={() => toggle(c.id)} style={{ width: 18, height: 18, accentColor: COLORS.checked }} />
                <span style={{ flex: 1, fontSize: 14, color: on ? COLORS.muted : COLORS.text, textDecoration: on ? "line-through" : "none" }}>{c.al}</span>
                <span style={{ fontSize: 13, color: on ? COLORS.muted : COLORS.text, whiteSpace: "nowrap" }}>{c[wk]}</span>
              </label>
            );
          })}
        </div>
      ))}
      <p style={{ fontSize: 12, color: COLORS.muted, fontStyle: "italic", lineHeight: 1.5 }}>
        Placard (non compté) : thé vert, infusions, citrons bio (≈ 7/semaine), curcuma, cumin, curry, thym, gingembre, ail, oignons, gomasio.
        Légumineuses comptées cuites : 400 g cuites ≈ 160 g sèches ou 1 grande boîte égouttée.
      </p>
    </div>
  );
}

  const d = TERRAIN_LISTINGS;
  const items = zone === "tous" ? d.items : d.items.filter((it) => it.zoneType === zone);
  const historyItems = Object.values(terrainArchive || {});

  function setStatusFor(item, status) {
    setOfferStatus((prev) => {
      const next = { ...prev };
      if (status) next[item.id] = status;
      else delete next[item.id];
      return next;
    });
    setTerrainArchive((prev) => {
      const next = { ...prev };
      if (status === "interessant") next[item.id] = item;
      else delete next[item.id];
      return next;
    });
  }

  return (
    <div>
      <div style={{ marginBottom: 20 }}>
        <h1 style={{ fontFamily: FONT_DISPLAY, fontSize: 32, color: COLORS.text, margin: 0, fontWeight: 600 }}>Terrain & Immo</h1>
        <p style={{ color: COLORS.muted, fontSize: 13, marginTop: 8, marginBottom: 4, lineHeight: 1.5 }}>{d.criteria}</p>
        <p style={{ color: COLORS.muted, fontSize: 12, fontStyle: "italic", marginBottom: 4, lineHeight: 1.5 }}>{d.note}</p>
        <span style={{ fontSize: 12, color: COLORS.muted }}>Mis à jour le {d.updatedAt}</span>
      </div>

      <PillTabs options={TERRAIN_TOP_SECTIONS} activeKey={section} onSelect={setSection} accentOf={() => TERRAIN_ACCENT} marginBottom={16} />

      {section === "annonces" && (
        <div>
          <PillTabs options={TERRAIN_SECTIONS} activeKey={zone} onSelect={setZone} accentOf={() => TERRAIN_ACCENT} />

          {items.length === 0 ? (
            <p style={{ color: COLORS.muted, fontSize: 13, fontStyle: "italic" }}>Aucune annonce pour l'instant dans cette zone.</p>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              {items.map((item) => (
                <TerrainListingCard key={item.id} item={item} status={offerStatus[item.id] || null} onSetStatus={(id, s) => setStatusFor(item, s)} />
              ))}
            </div>
          )}
        </div>
      )}

      {section === "historique" && (
        <div>
          {historyItems.length === 0 ? (
            <p style={{ color: COLORS.muted, fontSize: 13, fontStyle: "italic" }}>
              Aucune annonce marquée "Intéressant" pour l'instant — elles resteront ici même après le renouvellement des annonces.
            </p>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              {historyItems.map((item) => (
                <TerrainListingCard
                  key={item.id}
                  item={item}
                  status={offerStatus[item.id] || "interessant"}
                  onSetStatus={(id, s) => setStatusFor(item, s)}
                />
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function PlanPageContent({ accent, title, intro, stages, resources, unitLabel = "Étape" }) {
  const [openStageId, setOpenStageId] = useState(null);
  const openStage = openStageId != null ? stages.find((s) => s.id === openStageId) : null;

  if (openStage) {
    return (
      <div>
        <PlanStageLesson stage={openStage} accent={accent} unitLabel={unitLabel} onBack={() => setOpenStageId(null)} />
      </div>
    );
  }

  return (
    <div>
      <h1 style={{ fontFamily: FONT_DISPLAY, fontSize: 26, color: COLORS.text, marginBottom: 6, fontWeight: 600 }}>
        {title}
      </h1>
      <p style={{ color: COLORS.muted, fontSize: 14, lineHeight: 1.6, marginBottom: 24 }}>{intro}</p>
      <PlanStageOverview stages={stages} accent={accent} unitLabel={unitLabel} onOpen={setOpenStageId} />
      <div style={{ height: 20 }} />
      <PlanResourcesSection resources={resources} accent={accent} />
    </div>
  );
}

function weatherEmoji(resume) {
  const s = (resume || "").toLowerCase();
  if (s.includes("orage")) return "⛈️";
  if (s.includes("neige")) return "❄️";
  if (s.includes("pluie") || s.includes("averse")) return "🌧️";
  if (s.includes("nuageux") || s.includes("couvert")) return "☁️";
  if (s.includes("dégagé") || s.includes("soleil") || s.includes("ensoleillé")) return "☀️";
  return "🌤️";
}

function parseAgendaTime(str) {
  const parseOne = (s) => {
    const m = (s || "").match(/(\d{1,2})h(\d{2})?/);
    if (!m) return null;
    return parseInt(m[1], 10) * 60 + (m[2] ? parseInt(m[2], 10) : 0);
  };
  const parts = (str || "").split(/[–—-]/).map((s) => s.trim());
  const start = parseOne(parts[0]);
  if (start == null) return null;
  const end = parts[1] ? parseOne(parts[1]) : null;
  return { start, end: end != null && end > start ? end : start + 20 };
}

// leur emoji) en un seul bloc replié "Routine matin" au lieu de lister chaque étape point par point —
// demande explicite du 14/09/2026 ("un temps que je place quand je veux les matins de ma semaine").
const ROUTINE_MATIN_EMOJIS = ["🧘", "🍳", "📖", "🌤️", "🏋️", "🚿"];

function isRoutineMatinItem(ev) {
  return ROUTINE_MATIN_EMOJIS.some((e) => (ev.title || "").startsWith(e));
}

function timeRangeStart(timeStr) {
  return (timeStr || "").split(/[–—-]/)[0].trim();
}

function timeRangeEnd(timeStr) {
  const parts = (timeStr || "").split(/[–—-]/);
  return parts[parts.length - 1].trim();
}

// La routine matin s'affiche toujours comme un bloc de 3h à partir de son heure de début — demande du
// 14/09/2026 ("cette routine sera maintenant un bloc de 3h") — peu importe la somme réelle des sous-tâches,
// puisque c'est un créneau que l'utilisateur place où il veut dans sa matinée.
function addHoursToTimeStr(timeStr, hours) {
  const m = (timeStr || "").match(/(\d{1,2})h(\d{2})?/);
  if (!m) return timeStr;
  let totalMin = parseInt(m[1], 10) * 60 + (m[2] ? parseInt(m[2], 10) : 0) + hours * 60;
  totalMin = ((totalMin % 1440) + 1440) % 1440;
  return `${pad2(Math.floor(totalMin / 60))}h${pad2(totalMin % 60)}`;
}

function groupRoutineMatin(items) {
  const result = [];
  let i = 0;
  while (i < items.length) {
    if (isRoutineMatinItem(items[i])) {
      let j = i;
      while (j < items.length && isRoutineMatinItem(items[j])) j++;
      const group = items.slice(i, j);
      if (group.length > 1) {
        const start = timeRangeStart(group[0].time);
        result.push({
          isRoutineGroup: true,
          time: `${start} – ${addHoursToTimeStr(start, 3)}`,
          title: "🌅 Routine matin",
          items: group,
        });
      } else {
        result.push(group[0]);
      }
      i = j;
    } else {
      result.push(items[i]);
      i++;
    }
  }
  return result;
}

function AgendaTimeline({ items, accent }) {
  const [expandedRoutine, setExpandedRoutine] = useState(false);
  const parsed = items.map((ev) => ({ ev, span: parseAgendaTime(ev.time) })).filter((x) => x.span);
  const grouped = groupRoutineMatin(items);

  return (
    <div style={{ background: COLORS.card, borderRadius: 12, border: `1px solid ${COLORS.cardBorder}`, padding: "22px 22px 16px", marginBottom: 28 }}>
      {parsed.length > 0 && (
        <React.Fragment>
          <div style={{ position: "relative", height: 6, background: COLORS.track, borderRadius: 3, margin: "0 2px 10px" }}>
            {parsed.map(({ ev, span }, i) => {
              const left = (span.start / 1440) * 100;
              const width = Math.max(((span.end - span.start) / 1440) * 100, 1.4);
              return (
                <div
                  key={i}
                  title={`${ev.time} — ${ev.title}`}
                  style={{
                    position: "absolute", left: `${left}%`, width: `${width}%`, top: -4, height: 14,
                    background: accent, borderRadius: 7, boxShadow: `0 0 0 3px ${COLORS.card}`,
                  }}
                />
              );
            })}
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: COLORS.muted, padding: "0 1px", marginBottom: 20 }}>
            {AGENDA_DAY_HOURS.map((h) => (
              <span key={h}>{String(h).padStart(2, "0")}h</span>
            ))}
          </div>
        </React.Fragment>
      )}
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {grouped.map((entry, i) =>
          entry.isRoutineGroup ? (
            <div key={i}>
              <div
                onClick={() => setExpandedRoutine((v) => !v)}
                style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}
              >
                <span style={{ width: 8, height: 8, borderRadius: "50%", background: accent, flexShrink: 0 }} />
                <span style={{ fontSize: 12, color: COLORS.muted, whiteSpace: "nowrap", minWidth: 96 }}>{entry.time}</span>
                <span style={{ fontSize: 14, fontWeight: 500, color: COLORS.text, flex: 1 }}>{entry.title}</span>
                <ChevronDown
                  size={14}
                  style={{ color: COLORS.muted, transform: expandedRoutine ? "rotate(180deg)" : "none", transition: "transform 0.15s", flexShrink: 0 }}
                />
              </div>
              {expandedRoutine && (

                  style={{
                    display: "flex", flexDirection: "column", gap: 8, marginTop: 8, marginLeft: 18,
                    paddingLeft: 10, borderLeft: `1px solid ${COLORS.border}`,
                  }}
                >
                  {entry.items.map((sub, j) => (
                    <div key={j} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <span style={{ fontSize: 11, color: COLORS.muted, whiteSpace: "nowrap", minWidth: 88 }}>{sub.time}</span>
                      <span style={{ fontSize: 13, color: COLORS.text }}>{sub.title}</span>
                    </div>

          ) : (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: accent, flexShrink: 0 }} />

              <span style={{ fontSize: 14, fontWeight: 500, color: COLORS.text }}>{entry.title}</span>
            </div>
          )

    </div>
  );
}

function RankTable({ columns, rows, highlightTeam }) {
  const templateColumns = columns.map((c) => c.width || "minmax(80px, 1fr)").join(" ");
  return (
    <div style={{ background: COLORS.card, border: `1px solid ${COLORS.cardBorder}`, borderRadius: 10, overflowX: "auto" }}>
      <div style={{ minWidth: "max-content" }}>
        <div
          style={{
            display: "grid", gridTemplateColumns: templateColumns, padding: "8px 14px", gap: 4,
            fontSize: 11, color: COLORS.muted, textTransform: "uppercase", letterSpacing: 0.4, borderBottom: `1px solid ${COLORS.cardBorder}`,
          }}
        >
          {columns.map((c) => (
            <div key={c.key} style={{ textAlign: c.align || "left" }}>{c.label}</div>
          ))}
        </div>
        {rows.map((r, i) => {
          const isHighlight = highlightTeam && r.team === highlightTeam;
          return (
            <div
              key={i}
              style={{
                display: "grid", gridTemplateColumns: templateColumns, padding: "8px 14px", gap: 4,
                fontSize: 13, color: isHighlight ? COLORS.checked : COLORS.text,
                background: isHighlight ? "rgba(102,187,106,0.1)" : "transparent",
                borderBottom: i < rows.length - 1 ? `1px solid ${COLORS.cardBorder}` : "none",
              }}
            >
              {columns.map((c) => (
                <div key={c.key} style={{ textAlign: c.align || "left", fontWeight: c.key === "pos" || isHighlight ? 600 : 400 }}>
                  {r[c.key]}
                </div>
              ))}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function BracketMatch({ match, highlightTeam }) {
  const played = match.done && match.score;
  const sideStyle = (name) => ({
    color: name === highlightTeam ? COLORS.checked : COLORS.text,
    fontWeight: name === highlightTeam ? 600 : 400,
  });
  return (
    <div
      style={{
        display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8,
        padding: "7px 10px", background: COLORS.card, border: `1px solid ${COLORS.cardBorder}`, borderRadius: 6, fontSize: 12,
      }}
    >
      <span style={sideStyle(match.a)}>{match.a}</span>
      <span style={{ color: played ? COLORS.muted : COLORS.muted, fontSize: 11, whiteSpace: "nowrap", padding: "0 6px" }}>
        {played ? match.score : "à venir"}
      </span>
      <span style={{ ...sideStyle(match.b), textAlign: "right" }}>{match.b}</span>
    </div>
  );
}

// Accueil de l'espace partagé "Les Chatchats" (ajouté 21/09/2026) — reprend les alertes
// Administratif/Terrain & Immo qui vivaient avant sur l'Accueil personnel de Clément, maintenant que
// ces deux onglets ont déménagé ici. Volontairement plus léger que l'Accueil de Clément (pas
// d'agenda/tâches du jour — ce sont des données du calendrier personnel de Clément, pas partagées).
function ChatchatsAccueilTab({ offerStatus, onNavigate }) {
  const [adminChecked, setAdminChecked] = useState(null);

  useEffect(() => {
    let cancelled = false;
    window.storage
      .get("admin-checked")
      .then((res) => {
        if (!cancelled) setAdminChecked(res ? JSON.parse(res.value) : {});
      })
      .catch(() => {
        if (!cancelled) setAdminChecked({});
      });
    return () => {
      cancelled = true;
    };
  }, []);

  const adminAlerts = [];
  if (adminChecked) {
    // "concours" (CRPE) exclu des alertes ici — ne concerne que Clément personnellement, pas
    // l'espace partagé (demande explicite du 21/09/2026). Reste visible dans l'onglet Administratif
    // lui-même (juste pas remonté en alerte sur cet Accueil).
    ADMIN_CATEGORIES.filter((cat) => cat.key !== "concours").forEach((cat) => {
      (ADMIN_DEFAULT_ITEMS[cat.key] || []).forEach((item) => {
        const d = daysUntil(item.nextDue);
        if (!adminChecked[item.id] && d !== null && d <= 30) {
          adminAlerts.push({ label: item.label, d, overdue: d < 0 });
        }
      });
    });
    adminAlerts.sort((a, b) => a.d - b.d);
  }

  const terrainCount = TERRAIN_LISTINGS.items.filter((it) => !offerStatus[it.id]).length;

  const hasAlerts = adminAlerts.length > 0 || terrainCount > 0;

  return (
    <div>
      <h1 style={{ fontFamily: FONT_DISPLAY, fontSize: 32, color: COLORS.text, marginBottom: 4, fontWeight: 600 }}>Les Chatchats</h1>
      <p style={{ color: COLORS.muted, fontSize: 14, marginBottom: 28 }}>L'espace partagé — administratif et projets immobiliers.</p>

      <div style={{ fontFamily: FONT_DISPLAY, fontSize: 18, color: "#D98FB3", marginBottom: 12 }}>Alertes</div>
      {adminChecked && !hasAlerts && (
        <p style={{ color: COLORS.muted, fontSize: 13, fontStyle: "italic" }}>Rien d'urgent aujourd'hui 🎉</p>
      )}
      {hasAlerts && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {adminAlerts.map((a, i) => (
            <button
              key={`admin-${i}`}
              onClick={() => onNavigate("administratif")}
              style={{
                display: "flex",
                alignItems: "center",
                gap: 10,
                textAlign: "left",
                width: "100%",
                background: COLORS.card,
                border: `1px solid ${a.overdue ? "#B85C5C" : "#D9A25C"}`,
                borderRadius: 10,
                padding: "12px 14px",
                cursor: "pointer",
                fontFamily: FONT_BODY,
              }}
            >
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: a.overdue ? "#B85C5C" : "#D9A25C", flexShrink: 0 }} />
              <span style={{ flex: 1, fontSize: 13, color: COLORS.text }}>
                {a.label} <span style={{ color: COLORS.muted }}>— {a.overdue ? "en retard" : `dans ${a.d} j.`}</span>
              </span>
              <ChevronRight size={16} style={{ color: COLORS.muted }} />
            </button>
          ))}
          {terrainCount > 0 && (
            <button
              onClick={() => onNavigate("terrain")}
              style={{
                display: "flex",
                alignItems: "center",
                gap: 10,
                textAlign: "left",
                width: "100%",
                background: COLORS.card,
                border: `1px solid ${COLORS.cardBorder}`,

          )}

const FRENCH_WEEKDAYS_SHORT = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];
const FRENCH_WEEKDAYS_LONG = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
const FRENCH_MONTHS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];

function pad2(n) {
  return String(n).padStart(2, "0");
}

function dateKey(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}

function startOfWeekMonday(d) {
  const r = new Date(d);
  const day = r.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  r.setDate(r.getDate() + diff);
  r.setHours(0, 0, 0, 0);
  return r;
}

function groupEventsByDate(events) {
  const map = {};
  events.forEach((e) => {
    if (!map[e.date]) map[e.date] = [];
    map[e.date].push(e);
  });
  Object.values(map).forEach((list) => list.sort((a, b) => a.time.localeCompare(b.time)));
  return map;
}

const TASK_CATEGORIES = {
  musique: { label: "Musique", accent: "#A088BB" },
  dessin: { label: "Dessin", accent: "#C98B6E" },
  blog: { label: "Blog", accent: "#6FA39E" },
  menuiserie: { label: "Menuiserie", accent: "#A67C52" },
  "recherche-emploi": { label: "Recherche d'emploi", accent: "#8FA6B3" },
  general: { label: "Tâche", accent: "#7C8AA3" },
};

const TASK_CATEGORY_KEYWORDS = {
  musique: /musique/i,
  dessin: /dessin/i,
  blog: /blog/i,
  menuiserie: /menuiserie/i,
  "recherche-emploi": /recherche|reconversion|alternance|int[ée]rim|emploi|candidature|entretien|mission/i,
};

function detectTaskCategory(text) {
  for (const key of Object.keys(TASK_CATEGORY_KEYWORDS)) {
    if (TASK_CATEGORY_KEYWORDS[key].test(text)) return key;
  }
  return "general";
}

function splitNumberedTasks(text) {
  return text
    .split(/\d+\.\s*/)
    .map((s) => s.trim())
    .filter(Boolean);
}

// Deux façons de déclarer des tâches sur un événement Google Calendar :
// 1. Titre au format "{Catégorie}, 1. … 2. …" (catégorie choisie explicitement)
// 2. Description commençant par "Tâche :" (une tâche) ou "Tâches :" (liste numérotée) —
//    la catégorie est alors déduite par mot-clé dans le TITRE uniquement (jamais dans le texte
//    des tâches elles-mêmes) : si le titre ne nomme clairement aucune catégorie, la tâche reste
//    "générale" (visible seulement dans Tâches du jour, jamais recopiée dans un autre onglet).
function parseTaskEvent(ev) {
  const title = (ev.title || "").trim();
  for (const key of Object.keys(TASK_CATEGORIES)) {
    if (key === "general") continue;
    const label = TASK_CATEGORIES[key].label;
    const prefix = label + ",";
    if (title.toLowerCase().startsWith(prefix.toLowerCase())) {
      const tasks = splitNumberedTasks(title.slice(prefix.length).trim());
      if (tasks.length > 0) return { key, label, tasks };
    }
  }

  const desc = (ev.description || "").trim();
  const descMatch = desc.match(/^tâches?\s*:\s*/i);
  if (descMatch) {
    const isPlural = /^tâches\s*:/i.test(desc);
    const rest = desc.slice(descMatch[0].length).trim();
    const tasks = isPlural ? splitNumberedTasks(rest) : [rest].filter(Boolean);
    if (tasks.length > 0) {
      const key = detectTaskCategory(title);
      return { key, label: TASK_CATEGORIES[key].label, tasks };
    }
  }

  return null;
}

function CalendarDayView({ eventsByDate, accent, refDate }) {
  const key = dateKey(refDate);
  const dayEvents = eventsByDate[key] || [];

  if (dayEvents.length === 0) {
    return <p style={{ color: COLORS.muted, fontSize: 13, fontStyle: "italic" }}>Rien de prévu ce jour-là.</p>;
  }

  return <AgendaTimeline items={dayEvents} accent={accent} />;
}

function CalendarWeekView({ eventsByDate, accent, refDate }) {
  const monday = startOfWeekMonday(refDate);
  const days = Array.from({ length: 7 }, (_, i) => addDays(monday, i));
  const todayKey = dateKey(new Date());

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, minmax(150px, 1fr))", gap: 10, overflowX: "auto" }}>
        {days.map((d, i) => {
          const key = dateKey(d);
          const isToday = key === todayKey;
          const dayEvents = groupRoutineMatin(eventsByDate[key] || []);
          return (
            <div
              key={key}
              style={{
                background: COLORS.card, borderRadius: 12, border: `1px solid ${isToday ? accent : COLORS.cardBorder}`,
                padding: "12px 12px 14px", minHeight: 160,
              }}
            >
              <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-start", marginBottom: 10 }}>
                <span style={{ fontSize: 11, color: COLORS.muted, textTransform: "uppercase", letterSpacing: 0.4 }}>{FRENCH_WEEKDAYS_SHORT[i]}</span>
                <span style={{ fontFamily: FONT_DISPLAY, fontSize: 20, color: isToday ? accent : COLORS.text }}>{d.getDate()}</span>
              </div>
              {dayEvents.length === 0 ? (
                <p style={{ fontSize: 11, color: COLORS.muted, fontStyle: "italic", margin: 0 }}>—</p>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  {dayEvents.map((ev, j) => (
                    <div key={j}>
                      <div style={{ fontSize: 10, color: COLORS.muted }}>{ev.time.split(" – ")[0]}</div>
                      <div style={{ fontSize: 12, color: COLORS.text, lineHeight: 1.3 }}>{ev.title}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function CalendarMonthView({ eventsByDate, accent, refDate }) {
  const year = refDate.getFullYear();
  const month = refDate.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const lastOfMonth = new Date(year, month + 1, 0);
  const gridStart = startOfWeekMonday(firstOfMonth);
  const gridEnd = addDays(startOfWeekMonday(lastOfMonth), 6);
  const totalDays = Math.round((gridEnd - gridStart) / 86400000) + 1;
  const days = Array.from({ length: totalDays }, (_, i) => addDays(gridStart, i));
  const todayKey = dateKey(new Date());
  const [expandedDate, setExpandedDate] = useState(null);
  const expandedDay = expandedDate ? days.find((d) => dateKey(d) === expandedDate) : null;
  const expandedEvents = expandedDate ? groupRoutineMatin(eventsByDate[expandedDate] || []) : [];

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 6, marginBottom: 6 }}>
        {FRENCH_WEEKDAYS_SHORT.map((w) => (
          <div key={w} style={{ fontSize: 11, color: COLORS.muted, textAlign: "center", textTransform: "uppercase", letterSpacing: 0.4 }}>
            {w}
          </div>
        ))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 6 }}>
        {days.map((d) => {
          const key = dateKey(d);
          const inMonth = d.getMonth() === month;
          const isToday = key === todayKey;
          const dayEvents = groupRoutineMatin(eventsByDate[key] || []);
          const shown = dayEvents.slice(0, 2);
          const extra = dayEvents.length - shown.length;
          return (
            <div
              key={key}
              onClick={() => dayEvents.length > 0 && setExpandedDate(key)}
              style={{
                background: inMonth ? COLORS.card : "transparent",
                border: `1px solid ${isToday ? accent : inMonth ? COLORS.cardBorder : "transparent"}`,
                borderRadius: 8, padding: "6px 7px", minHeight: 78,
                cursor: dayEvents.length > 0 ? "pointer" : "default",
              }}
            >
              <div style={{ fontSize: 12, fontWeight: isToday ? 600 : 400, color: isToday ? accent : inMonth ? COLORS.text : COLORS.muted, marginBottom: 4 }}>
                {d.getDate()}
              </div>
              {shown.map((ev, j) => (
                <div
                  key={j}
                  style={{ fontSize: 10, color: inMonth ? COLORS.muted : COLORS.muted, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}
                >
                  {ev.title}
                </div>
              ))}
              {extra > 0 && <div style={{ fontSize: 10, color: inMonth ? COLORS.muted : COLORS.muted }}>+{extra}</div>}
            </div>
          );
        })}
      </div>

      {expandedDate && (
        <div
          onClick={() => setExpandedDate(null)}
          style={{
            position: "fixed", inset: 0, background: "rgba(10,17,40,0.65)",
            display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 20,
          }}
        >
          <div
            onClick={(e) => e.stopPropagation()}
            style={{
              background: COLORS.card, border: `1px solid ${COLORS.cardBorder}`, borderRadius: 12,
              padding: "20px 22px", maxWidth: 420, width: "100%", maxHeight: "80vh", overflowY: "auto",
            }}
          >
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <div style={{ fontFamily: FONT_DISPLAY, fontSize: 18, color: COLORS.text, textTransform: "capitalize" }}>
                {expandedDay && `${FRENCH_WEEKDAYS_LONG[(expandedDay.getDay() + 6) % 7]} ${expandedDay.getDate()} ${FRENCH_MONTHS[expandedDay.getMonth()]}`}
              </div>
              <button
                onClick={() => setExpandedDate(null)}
                aria-label="Fermer"
                style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.muted, padding: 4 }}
              >
                <X size={16} />
              </button>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {expandedEvents.map((ev, i) => (
                <div key={i} style={{ display: "flex", alignItems: "baseline", gap: 12 }}>
                  <span style={{ fontSize: 12, color: COLORS.muted, whiteSpace: "nowrap", minWidth: 96 }}>{ev.time}</span>
                  <span style={{ fontSize: 14, color: COLORS.text }}>{ev.title}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function CalendrierTab() {
  const accent = "#7FB3A3";
  const [view, setView] = useState("semaine");
  const [refDate, setRefDate] = useState(() => new Date());
  const eventsByDate = groupEventsByDate([...CALENDAR_DATA.events, ...SPORTS_EVENTS, ...MUSCU_EVENTS]);

  function shiftDate(amount) {
    setRefDate((d) => {
      if (view === "jour") return addDays(d, amount);
      if (view === "semaine") return addDays(d, amount * 7);
      return new Date(d.getFullYear(), d.getMonth() + amount, d.getDate());
    });
  }

  function goToday() {
    setRefDate(new Date());
  }

  let periodLabel;
  if (view === "jour") {
    periodLabel = `${FRENCH_WEEKDAYS_LONG[(refDate.getDay() + 6) % 7]} ${refDate.getDate()} ${FRENCH_MONTHS[refDate.getMonth()]} ${refDate.getFullYear()}`;
  } else if (view === "semaine") {
    const monday = startOfWeekMonday(refDate);
    const sunday = addDays(monday, 6);
    periodLabel = `Semaine du ${monday.getDate()} au ${sunday.getDate()} ${FRENCH_MONTHS[sunday.getMonth()]} ${sunday.getFullYear()}`;
  } else {
    periodLabel = `${FRENCH_MONTHS[refDate.getMonth()]} ${refDate.getFullYear()}`;
  }

  return (
    <div>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 20, flexWrap: "wrap", gap: 8 }}>
        <h1 style={{ fontFamily: FONT_DISPLAY, fontSize: 28, color: COLORS.text, margin: 0, fontWeight: 600 }}>Calendrier</h1>
        <span style={{ fontSize: 12, color: COLORS.muted }}>Mis à jour le {CALENDAR_DATA.updatedAt}</span>
      </div>

      <PillTabs options={CALENDAR_VIEWS} activeKey={view} onSelect={setView} accentOf={() => accent} marginBottom={20} />

      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 24 }}>
        <button
          onClick={() => shiftDate(-1)}
          aria-label="Période précédente"
          style={{
            width: 30, height: 30, borderRadius: "50%", border: `1px solid ${COLORS.cardBorder}`, background: COLORS.card,
            display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0,
          }}
        >
          <ChevronRight size={14} style={{ transform: "rotate(180deg)", color: COLORS.text }} />
        </button>
        <div style={{ fontFamily: FONT_DISPLAY, fontSize: 16, color: COLORS.text, textTransform: "capitalize", textAlign: "center", flex: "1 1 auto", minWidth: 0 }}>
          {periodLabel}
        </div>
        <button
          onClick={() => shiftDate(1)}
          aria-label="Période suivante"
          style={{
            width: 30, height: 30, borderRadius: "50%", border: `1px solid ${COLORS.cardBorder}`, background: COLORS.card,
            display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0,
          }}
        >
          <ChevronRight size={14} style={{ color: COLORS.text }} />
        </button>
        <button
          onClick={goToday}
          style={{
            padding: "6px 14px", borderRadius: 999, border: `1px solid ${COLORS.border}`, background: "transparent",
            color: COLORS.muted, fontFamily: FONT_BODY, fontSize: 12, cursor: "pointer", flexShrink: 0, whiteSpace: "nowrap",
          }}
        >
          Aujourd'hui
        </button>
      </div>

      {view === "jour" && <CalendarDayView eventsByDate={eventsByDate} accent={accent} refDate={refDate} />}
      {view === "semaine" && <CalendarWeekView eventsByDate={eventsByDate} accent={accent} refDate={refDate} />}
      {view === "mois" && <CalendarMonthView eventsByDate={eventsByDate} accent={accent} refDate={refDate} />}
    </div>
  );
}

function extractPercent(part) {
  const m = part.match(/@(\d+(?:\.\d+)?)%/);
  return m ? parseFloat(m[1]) : null;
}

// Arrondi au 2,5 kg le plus proche — plus petit incrément chargeable sur une barre olympique.
function computeWeightFromMax(pct, max) {
  if (pct == null || !max || isNaN(max) || max <= 0) return null;
  return Math.round(((max * pct) / 100) / 2.5) * 2.5;
}

function musculationWeekStatus(checked, week) {
  const done = MUSCU_SEANCES.filter((s) => checked[`${week.n}-${s.key}`]).length;
  return { done, total: MUSCU_SEANCES.length, complete: done === MUSCU_SEANCES.length };
}

function isMusculationCurrentWeek(week) {
  const start = new Date(week.start + "T00:00:00");
  const end = addDays(start, 6);
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  return now >= start && now <= end;
}

function ProgressRing({ done, total, size = 84, accent }) {
  const pct = total > 0 ? done / total : 0;
  const stroke = 8;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ flexShrink: 0 }}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={COLORS.track} strokeWidth={stroke} />
      <circle
        cx={size / 2} cy={size / 2} r={r} fill="none" stroke={accent} strokeWidth={stroke}
        strokeDasharray={c} strokeDashoffset={c * (1 - pct)} strokeLinecap="round"
        transform={`rotate(-90 ${size / 2} ${size / 2})`}
      />
      <text x="50%" y="50%" textAnchor="middle" dominantBaseline="central" fill={COLORS.text} fontFamily={FONT_DISPLAY} fontSize={size * 0.22} fontWeight="600">
        {done}/{total}
      </text>
    </svg>
  );
}

  const skipPart = (p) => p === "Warm-up" || p === "Med Ball";

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>

function MusculationTab() {
  const [checked, setChecked] = useState(null);
  const [log, setLog] = useState(null);
  const [maxes, setMaxes] = useState(null);
  const [section, setSection] = useState("programme");
  const [selectedWeek, setSelectedWeek] = useState(null);

  useEffect(() => {
    let cancelled = false;
    async function load() {
      let val = {};
      try {
        const res = await window.storage.get("musculation-weeks-checked");
        val = res ? JSON.parse(res.value) : {};
      } catch {
        val = {};
      }
      let logVal = {};
      try {
        const res = await window.storage.get("musculation-log");
        logVal = res ? JSON.parse(res.value) : {};
      } catch {
        logVal = {};
      }
      let maxesVal = {};
      try {
        const res = await window.storage.get("musculation-maxes");
        maxesVal = res ? JSON.parse(res.value) : {};
      } catch {
        maxesVal = {};
      }
      if (!cancelled) {
        setChecked(val);
        setLog(logVal);
        setMaxes(maxesVal);
        const current = MUSCU_WEEKS.find((w) => isMusculationCurrentWeek(w));
        setSelectedWeek(current ? current.n : 1);
      }
    }
    load();
    return () => {
      cancelled = true;
    };
  }, []);

  function toggleSeance(weekN, seanceKey) {
    setChecked((prev) => {
      const current = prev || {};
      const id = `${weekN}-${seanceKey}`;
      const next = { ...current, [id]: !current[id] };
      window.storage.set("musculation-weeks-checked", JSON.stringify(next)).catch(() => {});
      return next;
    });
  }

  function onLogChange(id, value) {
    setLog((prev) => {
      const next = { ...(prev || {}), [id]: value };
      window.storage.set("musculation-log", JSON.stringify(next)).catch(() => {});
      return next;
    });
  }

  function onMaxChange(key, value) {
    setMaxes((prev) => {
      const next = { ...(prev || {}), [key]: value };
      window.storage.set("musculation-maxes", JSON.stringify(next)).catch(() => {});
      return next;
    });
  }

  if (!checked || !log || !maxes || selectedWeek == null) return null;

  const totalUnits = MUSCU_WEEKS.length * MUSCU_SEANCES.length;
  const doneUnits = MUSCU_WEEKS.reduce((sum, w) => sum + musculationWeekStatus(checked, w).done, 0);
  const weeksComplete = MUSCU_WEEKS.filter((w) => musculationWeekStatus(checked, w).complete).length;
  const week = MUSCU_WEEKS.find((w) => w.n === selectedWeek);

  return (
    <div>
      <h1 style={{ fontFamily: FONT_DISPLAY, fontSize: 32, color: COLORS.text, margin: 0, marginBottom: 6, fontWeight: 600 }}>Musculation</h1>
      <p style={{ color: COLORS.muted, fontSize: 14, lineHeight: 1.6, marginBottom: 8 }}>
        Programme Argonautes Aix-en-Provence — Sr Elite 2027, 14 septembre → 2 novembre 2026 (cycle sur 9 semaines).
      </p>
      <p style={{ color: COLORS.muted, fontSize: 13, fontStyle: "italic", lineHeight: 1.6, marginBottom: 24 }}>
        "Whatever your hand finds to do, do it with all your might."
      </p>

      <PillTabs options={MUSCU_SECTIONS} activeKey={section} onSelect={setSection} accentOf={(s) => s.accent} />

      {section === "maxes" && <MusculationMaxesForm maxes={maxes} onChange={onMaxChange} />}

      {section === "programme" && (
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 20, marginBottom: 24, flexWrap: "wrap" }}>
            <ProgressRing done={doneUnits} total={totalUnits} accent={MUSCU_ACCENT} />
            <div>
              <div style={{ fontSize: 14, fontWeight: 500, color: COLORS.text, marginBottom: 4 }}>{weeksComplete} / {MUSCU_WEEKS.length} semaines complètes</div>
              <div style={{ fontSize: 12, color: COLORS.muted }}>{doneUnits} / {totalUnits} séances au total</div>
            </div>
          </div>

          <div style={{ background: COLORS.card, borderRadius: 10, padding: "14px 16px", borderLeft: `3px solid ${MUSCU_ACCENT}`, marginBottom: 24 }}>
            <div style={{ fontSize: 14, fontWeight: 500, color: COLORS.text, marginBottom: 4 }}>Méthode : Rep Max</div>
            <p style={{ fontSize: 13, color: COLORS.text, lineHeight: 1.6, margin: 0 }}>
              On travaille toujours en Rep Max : pour 3 séries de 8, les séries de travail se font à une charge qui permet de faire 8 répétitions et
              pas une de plus. Si tu peux en faire plus que prévu (max sous-évalué), fais le maximum de reps et réévalue ton max en conséquence pour
              la séance suivante. Échauffement avant chaque séance : 5 minutes de cardio (corde à sauter, dot drills, rameur, etc.).
            </p>
          </div>

          <MusculationWeekDots checked={checked} selectedWeek={selectedWeek} onSelect={setSelectedWeek} />
          <MusculationWeekDetail week={week} checked={checked} onToggleSeance={toggleSeance} log={log} onLogChange={onLogChange} maxes={maxes} />
        </div>
      )}
    </div>
  );
}
