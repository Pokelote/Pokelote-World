    { id: "mutuelle", label: "Mutuelle santé", frequency: "Renouvellement annuel", nextDue: null },
    { id: "carte-vitale", label: "Carte vitale — mise à jour", frequency: "À vérifier régulièrement", nextDue: null },
  ],
  finances: [
    { id: "declaration-revenus", label: "Déclaration de revenus", frequency: "Annuel — généralement en mai", nextDue: null },
    { id: "taxe-fonciere-habitation", label: "Taxe foncière / d'habitation", frequency: "Annuel — automne", nextDue: null },
  ],
  abonnements: [
    { id: "box-internet", label: "Box internet / téléphone", frequency: "Contrat à vérifier périodiquement", nextDue: null },
    { id: "energie", label: "Contrat énergie (électricité / gaz)", frequency: "Contrat à vérifier périodiquement", nextDue: null },
  ],
  concours: [
    {
      id: "crpe-inscription-2027",
      label: "Inscription CRPE 2027 (externe bac+3)",
      frequency: "Date officielle publiée sur devenirenseignant.gouv.fr — ouverture le 01/10/2026 à 12h sur Cyclades, clôture le 25/11/2026 à 12h",
      nextDue: "2026-10-01",
    },
  ],
};

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const target = new Date(dateStr + "T00:00:00");
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  return Math.round((target - now) / 86400000);
}

function AdminItemRow({ item, checked, onToggle }) {
  const d = daysUntil(item.nextDue);
  const overdue = !checked && d !== null && d < 0;
  const urgent = !checked && d !== null && d >= 0 && d <= 30;

  return (
    <div
      onClick={() => onToggle(item.id)}
      style={{
        display: "flex",
        alignItems: "flex-start",
        gap: 10,
        padding: "10px 4px",
        cursor: "pointer",
        borderBottom: `1px solid ${COLORS.border}`,
      }}
    >
      <span
        style={{
          width: 18,
          height: 18,
          borderRadius: 5,
          border: `1.5px solid ${checked ? COLORS.checked : COLORS.muted}`,
          background: checked ? COLORS.checked : "transparent",
          flexShrink: 0,
          marginTop: 1,
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
        }}
      >
        {checked && <Check size={11} color="white" />}
      </span>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 14, color: checked ? COLORS.muted : COLORS.text, textDecoration: checked ? "line-through" : "none" }}>
          {item.label}
        </div>
        <div style={{ fontSize: 12, color: COLORS.muted, marginTop: 2 }}>{item.frequency}</div>
      </div>
      {(overdue || urgent) && (
        <span
          style={{
            fontSize: 10,
            whiteSpace: "nowrap",
            padding: "2px 8px",
            borderRadius: 999,
            border: `1px solid ${overdue ? "#B85C5C" : "#D9A25C"}`,
            color: overdue ? "#B85C5C" : "#D9A25C",
            flexShrink: 0,
          }}
        >
          {overdue ? "En retard" : "Échéance proche"}
        </span>
      )}
    </div>
  );
}

function AdministratifTab() {
  const [checked, setChecked] = useState(null);

  useEffect(() => {
    let cancelled = false;
    async function load() {
      let val = {};
      try {
        const res = await window.storage.get("admin-checked");
        val = res ? JSON.parse(res.value) : {};
      } catch {
        val = {};
      }
      if (!cancelled) setChecked(val);
    }
    load();
    return () => {
      cancelled = true;
    };
  }, []);

  function toggle(id) {
    setChecked((prev) => {
      const current = prev || {};
      const next = { ...current, [id]: !current[id] };
      window.storage.set("admin-checked", JSON.stringify(next)).catch(() => {});
      return next;
    });
  }

  if (!checked) return null;

  return (
    <div>
      <h1 style={{ fontFamily: FONT_DISPLAY, fontSize: 32, color: COLORS.text, marginBottom: 6, fontWeight: 600 }}>Administratif</h1>
      <p style={{ color: COLORS.muted, fontSize: 14, lineHeight: 1.6, marginBottom: 24 }}>
        Récap annuel de ce qu'il y a à gérer, avec un repère visuel quand une échéance approche ou est dépassée.
      </p>
      {ADMIN_CATEGORIES.map((cat) => {
        const items = ADMIN_DEFAULT_ITEMS[cat.key] || [];
        const doneCount = items.filter((it) => checked[it.id]).length;
        return (
          <CollapsibleSection key={cat.key} title={cat.label} accent={ADMIN_ACCENT} badge={`${doneCount} / ${items.length}`}>
            {items.map((it) => (
              <AdminItemRow key={it.id} item={it} checked={!!checked[it.id]} onToggle={toggle} />
            ))}
          </CollapsibleSection>
        );
      })}
    </div>
  );
}

function PlaceholderTab({ tab }) {
  return (
    <div>
      <h1 style={{ fontFamily: FONT_DISPLAY, fontSize: 32, color: COLORS.text, marginBottom: 14, fontWeight: 600 }}>{tab.label}</h1>
      <div style={{ border: `1px dashed ${COLORS.muted}`, borderRadius: 10, padding: "22px 24px", color: COLORS.muted, fontSize: 14, lineHeight: 1.6 }}>
        Cet espace est prêt à être personnalisé. Dites-moi ce que vous voulez y suivre et on le construit ensemble.
      </div>
    </div>
  );
}

function TaskChecklistItem({ id, label, checked, accent, onToggle }) {
  return (
    <div onClick={() => onToggle(id)} style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
      <span
        style={{
          width: 18, height: 18, borderRadius: 4, flexShrink: 0,
          border: `1.5px solid ${checked ? COLORS.checked : COLORS.border}`,
          background: checked ? COLORS.checked : "transparent",
          display: "flex", alignItems: "center", justifyContent: "center",
        }}
      >
        {checked && <Check size={11} color="white" />}
      </span>
      <span style={{ fontSize: 14, color: checked ? COLORS.muted : COLORS.text, textDecoration: checked ? "line-through" : "none" }}>{label}</span>
    </div>
  );
}

function ThemeList({ theme, items, onChange }) {
  const accent = theme.accent;

  function patchItem(id, patch) {
    onChange((prev) => prev.map((it) => (it.id === id ? { ...it, ...patch } : it)));
  }

  if (items.length === 0) return null;

  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(min(300px, 100%), 1fr))", gap: 10, alignItems: "start" }}>
      {items.map((it) => (
        <ItemRow key={it.id} item={it} accent={accent} onPatch={(patch) => patchItem(it.id, patch)} />
      ))}
    </div>
  );
}

function ItemRow({ item, accent, onPatch }) {
  const watched = item.status === "vu";
  const isSerie = item.type === "serie";
  const isUpcoming = !!item.upcoming;
  const [episodesOpen, setEpisodesOpen] = useState(false);
  const seasons = item.seasons || [];
  const totalEp = seasons.reduce((s, se) => s + se.episodeCount, 0);
  const watchedEp = seasons.reduce((s, se) => s + (se.watched || []).length, 0);

  function toggleStatus() {
    if (isUpcoming) return;
    onPatch({ status: watched ? "avoir" : "vu" });
  }

  function setSeasons(nextSeasons) {
    onPatch({ seasons: nextSeasons });
  }

  return (
    <div style={{ background: COLORS.card, borderRadius: 10, padding: "16px 18px", borderLeft: `3px solid ${watched ? COLORS.checked : COLORS.cardBorder}`, opacity: isUpcoming ? 0.6 : 1 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
        <button
          onClick={toggleStatus}
          disabled={isUpcoming}
          aria-label={watched ? "Marquer à voir" : "Marquer comme vu"}
          style={{
            width: 24, height: 24, borderRadius: "50%",
            border: `2px solid ${watched ? COLORS.checked : COLORS.border}`,
            background: watched ? COLORS.checked : "transparent",
            display: "flex", alignItems: "center", justifyContent: "center", cursor: isUpcoming ? "default" : "pointer", flexShrink: 0,
          }}
        >
          {watched && <Check size={14} color="white" />}
        </button>
        <div style={{ flex: 1 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            {isSerie ? (
              <Tv size={12} color={COLORS.muted} />
            ) : item.type === "livre" ? (
              <BookIcon size={12} color={COLORS.muted} />
            ) : (
              <FilmIcon size={12} color={COLORS.muted} />
            )}
            <span style={{ fontFamily: FONT_BODY, fontSize: 15, fontWeight: 500, color: COLORS.text }}>{item.title}</span>
            {isUpcoming && (
              <span style={{ fontSize: 10, color: COLORS.muted, border: `1px solid ${COLORS.border}`, borderRadius: 999, padding: "1px 8px" }}>
                à venir
              </span>
            )}
          </div>
          {item.extra && <div style={{ fontSize: 12, color: COLORS.muted, marginTop: 2 }}>{item.extra}</div>}
        </div>
      </div>

      {isSerie && seasons.length > 0 && (
        <div style={{ marginTop: 10 }}>
          <button
            onClick={() => setEpisodesOpen((o) => !o)}
            style={{ display: "flex", alignItems: "center", gap: 5, background: "none", border: "none", cursor: "pointer", color: COLORS.muted, fontFamily: FONT_BODY, fontSize: 12, padding: 0 }}
          >
            <ChevronDown size={13} style={{ transform: episodesOpen ? "rotate(180deg)" : "none", transition: "transform 0.15s" }} />
            Épisodes {totalEp > 0 ? `(${watchedEp} / ${totalEp})` : ""}
          </button>
          {episodesOpen && <EpisodeTracker accent={accent} seasons={seasons} onChange={setSeasons} />}
        </div>
      )}
    </div>
  );
}

function EpisodeTracker({ accent, seasons, onChange }) {
  function toggleEpisode(seasonId, epNum) {
    onChange(
      seasons.map((s) => {
        if (s.id !== seasonId) return s;
        const has = s.watched.includes(epNum);
        return { ...s, watched: has ? s.watched.filter((e) => e !== epNum) : [...s.watched, epNum] };
      })
    );
  }

  return (
    <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px dashed ${COLORS.border}` }}>
      {seasons
        .slice()
        .sort((a, b) => a.number - b.number)
        .map((s) => (
          <div key={s.id} style={{ marginBottom: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
              <span style={{ fontSize: 12, fontWeight: 500, color: COLORS.text }}>Saison {s.number}</span>
              <span style={{ fontSize: 11, color: COLORS.muted }}>{s.watched.length} / {s.episodeCount}</span>
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
              {Array.from({ length: s.episodeCount }, (_, i) => i + 1).map((ep) => {
                const isWatched = s.watched.includes(ep);
                return (
                  <button
                    key={ep}
                    onClick={() => toggleEpisode(s.id, ep)}
                    title={`Épisode ${ep}`}
                    style={{
                      width: 26, height: 22, fontSize: 10, borderRadius: 4,
                      border: `1px solid ${isWatched ? darken(COLORS.checked, 20) : COLORS.border}`,
                      background: isWatched ? COLORS.checked : "transparent",
                      color: isWatched ? "white" : COLORS.muted,
                      cursor: "pointer",
                    }}
                  >
                    {ep}
                  </button>
                );
              })}
            </div>
          </div>
        ))}
    </div>
  );
}

const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<App />);
document.getElementById("boot-message").style.display = "none";

} catch (err) {
  showBootError((err && err.message) ? err.message : String(err));
}
</script>
